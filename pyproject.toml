[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheetah-mir"
version = "0.1.0"
description = "Offline evidence-led financial research infrastructure"
requires-python = ">=3.12"
dependencies = ["networkx>=3.4,<4", "feedparser>=6,<7"]

[project.optional-dependencies]
market = ["akshare>=1.14"]
documents = ["docling-slim[convert-core,format-pdf]>=2.147,<3"]
test = ["pytest>=8,<10", "pandas>=2.2,<4", "reportlab>=4,<5"]

[project.scripts]
mir = "cheetah_mir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
